    .mcd .pl{font-weight:600;font-size:15px;line-height:1.2}
    .mcd .pl small{display:block;color:var(--gris);font-weight:400;font-size:12px}
    .mcd ol{list-style:none;margin:0;padding:4px 0}
    .mcd li{display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:14px}
    .mcd li+li{border-top:1px solid #eef2ef}
    .mcd .t{flex:0 0 26px;height:26px;border-radius:6px;background:var(--verde);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
    .mcd .c{margin-left:auto;font-size:11px;font-weight:700;color:var(--verde);background:#fff7dc;border:1px solid #ecd98f;border-radius:10px;padding:1px 7px}
    .mcd .vacio{color:var(--gris);text-align:center;padding:20px;display:none}
    .mcd .nota{text-align:center;color:var(--gris);font-size:12.5px;margin:4px 0 0}

ro": "Huasteca", "rama": "Femenil", "tabs": ["Maria Fernanda Carballo Hernandez", "Alexia Paola Lara Olguin", "Arely Anahi Medina Perez", "Lucero Anastacio Vidales"], "cap": 1}, {"cod": "PL-40", "plantel": "Chalco", "macro": "Huasteca", "rama": "Femenil", "tabs": ["Hadasa Yolotzin Gonzalez Cortes", "Fernanda Lizzeth Terrazas Antonio", "Angeles Araceli Manuel Flores", "Emilia Perez Martinez"], "cap": 1}, {"cod": "CE-21", "plantel": "La Pila", "macro": "Huasteca", "rama": "Varonil", "tabs": ["Jaime Martinez Lucas", "Emmanuel Gonzalez Martinez", "Rodrigo Salazar Martinez", "Ismael Martinez Hernandez"], "cap": 0}, {"cod": "CE-21", "plantel": "La Pila", "macro": "Huasteca", "rama": "Femenil", "tabs": ["Fatima Vega Martinez", "Flor Yazmin Mejia Hernandez", "Mayra Alejandra Hernandez Martinez", "Mariana Cruz Hernandez"], "cap": 0}, {"cod": "CE-29", "plantel": "El Carrizo", "macro": "Huasteca", "rama": "Femenil", "tabs": ["Eugenia Linet Agustin Sanchez", "Hailie Yareni Hinojoza Galvan", "Jade Montserrat Hinojoza Galvan", "Melissa Vicente Bautista"], "cap": 0}];

  function norm(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
  function texto(e){ return norm(e.plantel + " " + e.cod + " " + (e.cod[0]==="P"?"plantel ":"emsad ") + parseInt(e.cod.slice(3),10) + " " + e.tabs.join(" ")); }
  function pintar(){
    panel.innerHTML = ""; var f = norm(q.value.trim()), total = 0;
    ["Centro", "Huasteca"].forEach(function(m){
      var lista = datos.filter(function(e){ return e.rama === ramas[actual] && e.macro === m && (!f || texto(e).indexOf(f) >= 0); })

      if (!lista.length) return;
      total += lista.length;

        });
        card.appendChild(ol); g.appendChild(card);
      });
      panel.appendChild(g);
    });
    vacio.style.display = total ? "none" : "block";
  }
  ramas.forEach(function(r, i){

    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    b.onclick = function(){ actual = i; tabs.querySelectorAll("button").forEach(function(x,j){ x.setAttribute("aria-selected", j === i ? "true" : "false"); }); pintar(); };
