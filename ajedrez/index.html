<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajedrez · Participantes · Muestra Deportiva 2026</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../comun/icono-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="../comun/icono-48.png">
  <link rel="apple-touch-icon" href="../comun/icono-180.png">
  <style>
    body{margin:0;background:#fff}
    .mcd{--verde:#0d4a33;--verde2:#16694a;--oro:#c9a227;--tinta:#1d2a24;--gris:#66736c;--fondo:#f4f7f5;
      font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tinta);max-width:1100px;margin:0 auto;padding:8px}
    .mcd *{box-sizing:border-box}
    .mcd header{text-align:center;margin:4px 0 14px}
    .mcd h1{margin:0;font-size:clamp(20px,3.2vw,28px);color:var(--verde)}
    .mcd header p{margin:6px 0 0;color:var(--gris);font-size:14px}
    .mcd .tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 14px}
    .mcd .tabs button{font:inherit;font-size:14px;cursor:pointer;color:var(--verde);background:var(--fondo);border:1px solid #dfe7e2;border-radius:20px;padding:7px 14px}
    .mcd .tabs button[aria-selected="true"]{background:var(--verde);color:#fff;border-color:var(--verde)}
    .mcd .buscar{display:block;width:100%;max-width:420px;margin:0 auto 16px;padding:10px 14px;font-size:15px;border:1px solid #cfdad3;border-radius:10px;outline:none}
    .mcd .buscar:focus{border-color:var(--verde2);box-shadow:0 0 0 3px rgba(22,105,74,.15)}
    .mcd .panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
    .mcd .card{background:#fff;border:1px solid #dfe7e2;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(13,74,51,.07)}
    .mcd .card h2{margin:0;padding:12px 16px;background:var(--verde);color:#fff;font-size:16px;line-height:1.3}
    .mcd .card h2 small{display:block;font-weight:500;font-size:12.5px;opacity:.85}
    .mcd .card.fem h2{background:var(--verde2)}
    .mcd ol{list-style:none;margin:0;padding:4px 0}
    .mcd li{display:flex;align-items:center;gap:12px;padding:7px 16px}
    .mcd li+li{border-top:1px solid #eef2ef}
    .mcd .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--fondo);color:var(--verde);font-weight:700;display:grid;place-items:center;font-size:13px;border:2px solid var(--oro)}
    .mcd img{width:32px;height:32px;object-fit:contain;flex:0 0 32px}
    .mcd .eq{font-size:14.5px;line-height:1.25}
    .mcd .eq small{display:block;color:var(--gris);font-size:12px}
    .mcd .vacio{padding:12px 16px;color:var(--gris);font-size:14px;display:none}
    .mcd .nota{text-align:center;color:var(--gris);font-size:12.5px;margin:14px 0 0}
  </style>
</head>
<body>
<div class="mcd">

  <div class="tabs" role="tablist" id="mcd-tabs"></div>
  <input class="buscar" id="mcd-q" type="search" placeholder="Buscar nombre o plantel…" aria-label="Buscar">
  <div class="panel" id="mcd-panel"></div>
  <p class="nota">El número indica el lugar obtenido en la fase de macrorregión.</p>
</div>

    panel.innerHTML = "";
