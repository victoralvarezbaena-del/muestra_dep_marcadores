<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animación Deportiva · Horarios · Muestra Deportiva 2026</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../comun/icono-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="../comun/icono-48.png">
  <link rel="apple-touch-icon" href="../comun/icono-180.png">
  <style>
    body{margin:0;background:#fff}
    .mcd{--verde:#0d4a33;--verde2:#16694a;--oro:#c9a227;--tinta:#1d2a24;--gris:#66736c;--fondo:#f4f7f5;
      font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tinta);max-width:1100px;margin:0 auto;padding:8px}
    .mcd *{box-sizing:border-box}
    .mcd header{text-align:center;margin:4px 0 14px}
    .mcd h1{margin:0;font-size:clamp(20px,3.2vw,28px);color:var(--verde)}
    .mcd header p{margin:6px 0 0;color:var(--gris);font-size:14.5px}
    .mcd header p b{color:var(--tinta)}
    .mcd .tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 14px}
    .mcd .tabs button{font:inherit;font-size:14px;cursor:pointer;color:var(--verde);background:var(--fondo);border:1px solid #dfe7e2;border-radius:20px;padding:8px 16px}
    .mcd .tabs button[aria-selected="true"]{background:var(--verde);color:#fff;border-color:var(--verde)}
    .mcd .tabs small{opacity:.8;margin-left:4px}
    .mcd .datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 12px}
    .mcd .dato{background:var(--fondo);border:1px solid #e3ebe6;border-radius:12px;padding:10px 14px}
    .mcd .dato span{display:block;font-size:12px;color:var(--gris);text-transform:uppercase;letter-spacing:.4px}
    .mcd .dato b{font-size:15px}
    .mcd .ruta{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font-size:13.5px;margin:0 0 14px;color:var(--gris)}
    .mcd .ruta i{font-style:normal;background:#fff;border:1px solid #dfe7e2;border-radius:16px;padding:4px 10px;color:var(--tinta)}
    .mcd .ruta i.e{border-color:var(--oro);font-weight:600}
    .mcd .buscar{display:block;width:100%;max-width:420px;margin:0 auto 16px;padding:10px 14px;font-size:15px;border:1px solid #cfdad3;border-radius:10px;outline:none}
    .mcd .buscar:focus{border-color:var(--verde2);box-shadow:0 0 0 3px rgba(22,105,74,.15)}
    .mcd .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:16px}
    .mcd .card{background:#fff;border:1px solid #dfe7e2;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(13,74,51,.07)}
    .mcd .card h2{margin:0;padding:11px 16px;background:var(--verde);color:#fff;font-size:16.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .mcd .card.porra h2{background:var(--verde2)}
    .mcd .card h2 span{font-size:12.5px;font-weight:500;background:rgba(255,255,255,.16);padding:3px 10px;border-radius:20px;white-space:nowrap}
    .mcd .cols{display:grid;grid-template-columns:1fr repeat(3,72px);gap:6px;padding:6px 14px;font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid #eef2ef}
    .mcd .cols div:not(:first-child){text-align:center}
    .mcd .fila{display:grid;grid-template-columns:1fr repeat(3,72px);gap:6px;align-items:center;padding:7px 14px;transition:background .2s,opacity .2s}
    .mcd .fila+.fila,.mcd .nota+.fila,.mcd .fila+.nota{border-top:1px solid #eef2ef}
    .mcd .eq{display:flex;align-items:center;gap:10px;min-width:0}
    .mcd .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--fondo);color:var(--verde);font-weight:700;display:grid;place-items:center;font-size:12px;border:2px solid var(--oro)}
    .mcd img{width:32px;height:32px;object-fit:contain;flex:0 0 32px}
    .mcd .nom{font-size:14.5px;line-height:1.2;min-width:0}
    .mcd .nom small{display:block;color:var(--gris);font-size:12px}
    .mcd .h{text-align:center;font-size:13.5px;color:var(--gris);font-variant-numeric:tabular-nums}
    .mcd .h.e{color:var(--tinta);font-weight:700;background:#fff7dc;border-radius:8px;padding:3px 0}
    .mcd .fila.ex .nom{font-style:italic}
    .mcd .fila.ex .n{border-color:#dfe7e2;color:var(--oro)}
    .mcd .nota{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;font-size:13.5px;line-height:1.35}
    .mcd .nota.exh{background:#fffbea;color:#6b5512}
    .mcd .nota.pau{background:var(--fondo);color:var(--gris)}
    .mcd .nota b{white-space:nowrap}
    .mcd .premio{margin-top:16px;text-align:center;background:linear-gradient(135deg,var(--verde),var(--verde2));color:#fff;border-radius:14px;padding:16px}
    .mcd .premio b{display:block;font-size:18px;margin-bottom:2px}
    .mcd .fila.tenue,.mcd .nota.tenue{opacity:.28}
    .mcd .fila.marca{background:#eaf5ef}
    .mcd .pie{text-align:center;color:var(--gris);font-size:12.5px;margin:14px 0 0}
    @media (max-width:560px){
      .mcd .cols{display:none}
      .mcd .fila{grid-template-columns:repeat(3,1fr);row-gap:6px}
      .mcd .fila .eq{grid-column:1/-1}
      .mcd .h::before{content:attr(data-l);display:block;font-size:10.5px;text-transform:uppercase;color:var(--gris);font-weight:400;letter-spacing:.3px}
    }
  </style>
</head>
<body>

      var ok = !f || (r.dataset.q || "").indexOf(f) >= 0;
      r.classList.toggle("tenue", !!f && !ok);
      r.classList.toggle("marca", !!f && ok && r.classList.contains("fila"));
    });
  }
  vistas.forEach(function(v, i){
    var b = el("button"); b.type = "button"; b.setAttribute("role", "tab");
    b.textContent = v.etiqueta; b.appendChild(el("small", null, "· " + v.hora));
    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    b.onclick = function(){ actual = i; tabs.querySelectorAll("button").forEach(function(x, j){ x.setAttribute("aria-selected", j === i ? "true" : "false"); }); pintar(); };
    tabs.appendChild(b);
  });
  q.addEventListener("input", filtrar);
  pintar();
})();
</script>
