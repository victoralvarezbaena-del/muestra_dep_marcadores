<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador — Voleibol de Playa (2 Grupos)</title>
  <style>
    :root {
      --accent: #0284c7;
      --bg: #f8fafc;
      --panel: #e2e8f0;
      --card: #ffffff;
      --muted: #475569;
      --text: #0f172a;
      --ok: #16a34a;
      --bad: #dc2626;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:system-ui,-apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; overflow-x:hidden; }
    header{ padding:16px 12px; border-bottom:2px solid #cbd5e1; background:linear-gradient(90deg, var(--panel), #f1f5f9); position:sticky; top:0; z-index:10; }
    .container{ max-width:1200px; margin:0 auto; padding:12px; width:100%; }
    h1{ margin:0; font-size:clamp(20px,3.2vw,34px); }
    .subtitle{ color:var(--muted); margin-top:4px; font-size:14px; }

    .card{ background:var(--card); border:1px solid #cbd5e1; border-radius:16px; padding:14px; box-shadow:0 3px 10px rgba(0,0,0,.1); margin-bottom:14px; overflow:hidden; }
    .card h2{ margin:0 0 10px; font-size:18px; }

    .groups{ display:grid; gap:12px; }
    @media(min-width:700px){ .groups{ grid-template-columns:1fr 1fr; }}

    .groupA { background: rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.45); }
    .groupB { background: rgba(168,85,247,.12); border:1px solid rgba(168,85,247,.45); }
    .groupBox{ padding:12px; border-radius:12px; margin-bottom:12px; overflow:hidden; }

    .matches{ display:grid; gap:10px; margin-top:10px; }
    .match{ display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:center; background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:8px 6px; width:100%; }
    .team{ display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden; }
    .team-name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; max-width:100%; }
    .dash{ opacity:.6; font-size:14px; }

    .info{ display:flex; gap:6px; margin-top:4px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
    .info-item{ white-space:nowrap; }

    table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; overflow-x:auto; display:block; }
    th,td{ padding:6px 8px; border-bottom:1px solid #cbd5e1; text-align:right; white-space:nowrap; }
    th:first-child, td:first-child{ text-align:left; }
    thead th{ font-size:11px; color:var(--muted); font-weight:600; }
    tbody tr:hover{ background:#e2e8f0; }
    .pos{ font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
    .pts{ font-weight:800; }
    .first{ background:rgba(34,197,94,.15); }

    .bracket{ display:grid; gap:10px; margin-top:16px; }
    @media(min-width:900px){ .bracket{ grid-template-columns:1fr 1fr; } }
    .semi,.final,.third{ background:#ffffff; border:1px solid #cbd5e1; border-radius:12px; padding:10px; overflow:hidden; }
    .semi h3,.final h3,.third h3{ margin:0 0 6px; font-size:14px; }

    .final { position:relative; border:2px solid var(--accent); box-shadow:0 0 0 4px rgba(2,132,199,.12) inset; background:#ffffff; overflow:hidden; }
    .final h3{ color:var(--accent); }
    .final::before { content:'FINAL 🏐'; position:absolute; top:8px; right:-48px; transform:rotate(45deg); background:var(--accent); color:white; font-weight:700; font-size:12px; padding:3px 48px; box-shadow:0 2px 6px rgba(0,0,0,0.15); opacity:0.9; }

    /* Indicadores de sets */
    .sets-indicator{ display:flex; gap:3px; margin-top:4px; justify-content:center; flex-wrap:wrap; }
    .set-dot{ width:6px; height:6px; border-radius:50%; background-color:#cbd5e1; flex-shrink:0; }
    .set-dot.won{ background-color:var(--ok); }
    .set-dot.lost{ background-color:var(--bad); }
    .sets-score{ font-weight:bold; font-size:14px; white-space:nowrap; }
    .sets-detail{ margin-top:6px; font-size:12px; color:var(--muted); text-align:center; line-height:1.3; overflow-wrap:break-word; }
    .total-sets{ font-weight:bold; text-align:center; margin:6px 0; font-size:14px; white-space:nowrap; }
    .points-total{ font-size:12px; color:var(--muted); text-align:center; margin-bottom:6px; line-height:1.3; }

    .champion{ text-align:center; padding:16px; background:linear-gradient(135deg,#fef3c7,#fde68a); border-radius:18px; margin:16px 0; border:2px solid #f59e0b; }
    .champion h2{ color:#92400e; margin-bottom:8px; font-size:18px; }
    .champion .team-name{ font-size:20px; font-weight:bold; color:#92400e; }

    .loading{ text-align:center; padding:40px; color:var(--muted); }
    .error{ background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:16px; border-radius:12px; }

    /* Responsive para móviles */
    @media (max-width: 480px) {
      .container{ padding:8px 6px; }
      .card{ padding:12px; margin-bottom:12px; border-radius:14px; }
      .groupBox{ padding:10px; margin-bottom:10px; }
      .match{ grid-template-columns:1fr auto 1fr; gap:4px; padding:8px 6px; }
      .team-name{ font-size:13px; max-width:90px; }
      .sets-score{ font-size:13px; }
      .bracket{ gap:8px; }
      .semi,.final,.third{ padding:10px; }
      .semi h3,.final h3,.third h3{ font-size:14px; }
      table{ font-size:12px; }
      th,td{ padding:5px 6px; }
      .final::before { top:6px; right:-42px; font-size:11px; padding:2px 42px; }
      .champion{ padding:14px; }
      .champion .team-name{ font-size:18px; }
    }

    @media (max-width: 400px) {
      .team-name{ font-size:12px; max-width:80px; }
      .sets-score{ font-size:12px; }
      .match{ grid-template-columns:1fr auto 1fr; gap:3px; padding:6px 4px; }
      .sets-detail{ font-size:11px; }
      .info{ font-size:11px; }
      .card h2{ font-size:16px; }
      .groupBox h3{ font-size:15px; }
      .container{ padding:6px 4px; }
      header{ padding:12px 8px; }
      h1{ font-size:18px; }
      .subtitle{ font-size:13px; }
    }

    @media (max-width: 360px) {
      .team-name{ font-size:11px; max-width:70px; }
      .sets-score{ font-size:11px; }
      .match{ grid-template-columns:1fr auto 1fr; gap:2px; padding:5px 3px; }
      .sets-detail{ font-size:10px; }
      .info{ font-size:10px; }
      .card{ padding:10px; }
      .groupBox{ padding:8px; }
      table{ font-size:11px; }
      th,td{ padding:4px 5px; }
    }

    /* Scroll horizontal para tablas en móviles */
    .table-wrap {
      overflow-x: auto;
      width: 100%;
      -webkit-overflow-scrolling: touch;
    }
    
    .table-wrap table {
      min-width: 600px; /* Ancho mínimo para mantener legibilidad */
    }
  .team-identity{display:inline-flex;flex-direction:column;align-items:center;gap:5px;max-width:100%;text-align:center;vertical-align:middle;white-space:normal}
.team-identity img{width:96px;height:96px;object-fit:contain;background:white;border-radius:10px}
.school-label{display:block;color:#102a20;background:#e6f4ed;border:1px solid #94bba8;border-radius:6px;padding:5px 9px;font:700 14px/1.3 system-ui;overflow-wrap:anywhere}
.identity-name{font-size:12px;line-height:1.3;overflow-wrap:anywhere}
td .team-identity{flex-direction:row;text-align:left;gap:8px}td .team-identity img{width:48px;height:48px}
.identity-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.identity-editor{padding:14px;border:1px solid #cbd5e1;border-radius:10px;display:grid;gap:10px}.identity-editor input{width:100%;max-width:100%;box-sizing:border-box}
@media(max-width:600px){.team-identity img{width:64px;height:64px}.school-label{font-size:12px;padding:4px}.team{min-width:0}.team-name{white-space:normal!important}}
@media print{.team-identity img{width:60px;height:60px}.school-label{color:#000;background:white}}

.team-name:has(.team-identity){max-width:none;overflow:visible;white-space:normal}.team:has(.team-identity){min-width:0}
</style>

  <link rel="icon" type="image/png" sizes="48x48" href="../comun/icono-48.png">

<body>
  <header>
    <div class="container">
      <h1 id="tournamentTitle">Voleibol de Playa</h1>
      <div class="subtitle" id="tournamentSubtitle">Visualización de resultados</div>
    </div>
  </header>

  <main class="container">
    <div id="tournamentContent">
      <div class="card loading">
        <div class="subtitle">Cargando datos del torneo...</div>
      </div>
    </div>
  </main>

  <script>
let teamProfiles = Object.create(null);
function escapeIdentity(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalizeProfiles(profiles){const result=Object.create(null);if(profiles&&typeof profiles==='object')for(const [key,p] of Object.entries(profiles)){if(!p||typeof p!=='object')continue;result[key]={school:String(p.school||'').slice(0,180),image:(/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(p.image||'')||/^\.\.\/mascotas\/[A-Za-z0-9_-]+\.(webp|png|jpe?g)$/.test(p.image||''))?p.image:''};}return result;}
function teamIdentity(name){const p=teamProfiles[name]||{};const label=p.school||name;return `<span class="team-identity">${p.image?`<img src="${p.image}" alt="Mascota de ${escapeIdentity(label)}">`:''}<span><span class="school-label">${escapeIdentity(label)}</span>${p.school&&p.school!==name?`<span class="identity-name">${escapeIdentity(name)}</span>`:''}</span></span>`;}


    function getJsonFileNameFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      const t = urlParams.get('t') || urlParams.get('torneo');
      if (t) return t.includes('.') ? t : `${t}.json`;
      return 'data-playav.json';
    }

    function formatTimestamp(ts) {
      if (!ts) return '';
      try {
        let val = ts;
        if (typeof ts === 'string') val = ts.includes('-') ? ts : parseInt(ts);
        const d = new Date(val); 
        if (isNaN(d.getTime())) return '';
        const dd = String(d.getDate()).padStart(2,'0');
        const mm = String(d.getMonth()+1).padStart(2,'0');
        const yy = d.getFullYear();
        const hh = String(d.getHours()).padStart(2,'0');
        const mi = String(d.getMinutes()).padStart(2,'0');
        return `${dd}/${mm}/${yy} ${hh}:${mi}`;
      } catch { 
        return ''; 
      }
    }

    function applyTheme(theme) {
      if (!theme) return;
      const accent = theme.color || '#0284c7';
      const bg = theme.bg || '#f8fafc';
      document.documentElement.style.setProperty('--accent', accent);
      document.documentElement.style.setProperty('--bg', bg);
      document.body.style.background = bg;
      const header = document.querySelector('header');
      if (header) {
        header.style.background = `linear-gradient(90deg, color-mix(in srgb, ${accent} 15%, white), color-mix(in srgb, ${accent} 8%, white))`;
      }
    }

    function calculateSetsAndPoints(sets) {
      let hs=0, as=0, hp=0, ap=0;
      sets.forEach(s => { 
        if(s && s.home != null && s.away != null){ 
          hp += s.home || 0; 
          ap += s.away || 0; 
          if(s.home > s.away) hs++; 
          else if(s.away > s.home) as++; 
        }
      });
      return {homeSets: hs, awaySets: as, homePoints: hp, awayPoints: ap, pointsDifference: hp - ap};
    }

    function computeTable(matches, teams, cfg = {win: 2, loss: 1}) {
      const table = Object.fromEntries(teams.map(t => [t, {team: t, PJ: 0, G: 0, P: 0, SF: 0, SC: 0, DS: 0, PF: 0, PC: 0, DP: 0, Pts: 0}]));
      (matches || []).forEach(m => {
        if(!m || !m.sets || !m.sets.length) return;
        const h = table[m.home], a = table[m.away]; 
        if(!h || !a) return;
        const r = calculateSetsAndPoints(m.sets);
        h.PJ++; a.PJ++; 
        h.SF += r.homeSets; h.SC += r.awaySets; 
        a.SF += r.awaySets; a.SC += r.homeSets;
        h.PF += r.homePoints; h.PC += r.awayPoints; 
        a.PF += r.awayPoints; a.PC += r.homePoints;
        if(r.homeSets > r.awaySets){ 
          h.G++; a.P++; 
          h.Pts += cfg.win; a.Pts += cfg.loss; 
        } else { 
          a.G++; h.P++; 
          a.Pts += cfg.win; h.Pts += cfg.loss; 
        }
      });
      teams.forEach(t => { 
        table[t].DS = table[t].SF - table[t].SC; 
        table[t].DP = table[t].PF - table[t].PC; 
      });
      return Object.values(table).sort((a,b) => 
        b.Pts - a.Pts || b.DS - a.DS || b.DP - a.DP || b.PF - a.PF || a.team.localeCompare(b.team)
      );
    }

    function renderMatch(m, defHome, defAway) {
      const _m = Object.assign({sets: [], hour: '', place: ''}, m || {});
      const has = _m.sets && _m.sets.length > 0;
      const res = has ? calculateSetsAndPoints(_m.sets) : {homeSets: 0, awaySets: 0, homePoints: 0, awayPoints: 0};
      const hw = has && res.homeSets > res.awaySets, 
            aw = has && res.awaySets > res.homeSets;
      const home = _m.home || defHome || 'Equipo Local';
      const away = _m.away || defAway || 'Equipo Visitante';
      let detail = '';
      
      if (has) {
        const s = _m.sets.map((set, i) => 
          (set && set.home != null && set.away != null) ? `Set ${i+1}: ${set.home}-${set.away}` : ''
        ).filter(Boolean).join(' | ');
        if (s) detail = `<div class="sets-detail">${s}</div>`;
      }
      
      return `
        <div class="match">
          <div class="team ${hw ? 'winner' : ''}">
            <span class="team-name" title="${home}">${teamIdentity(home)}</span>
          </div>
          <div class="match-result">
            ${has ? `<span class="sets-score">${res.homeSets}</span><span class="dash">-</span><span class="sets-score">${res.awaySets}</span>` : '<span class="dash">-</span>'}
          </div>
          <div class="team ${aw ? 'winner' : ''}" style="justify-content:flex-end">
            <span class="team-name" title="${away}">${teamIdentity(away)}</span>
          </div>
        </div>
        ${has ? `
          <div class="points-total">Puntos: ${res.homePoints}-${res.awayPoints}</div>
          <div class="sets-indicator">${Array(res.homeSets).fill('<div class="set-dot won"></div>').join('')}${Array(res.awaySets).fill('<div class="set-dot lost"></div>').join('')}</div>
          ${detail}
        ` : ''}
        ${(_m.hour || _m.place) ? `
          <div class="info">
            ${_m.hour ? '<span class="info-item">🕒 '+_m.hour+'</span>' : ''} 
            ${_m.place ? '<span class="info-item">📍 '+_m.place+'</span>' : ''}
          </div>
        ` : ''}
      `;
    }

    function renderCover(data) {
      const theme = data.theme || {};
      const accent = theme.color || '#0284c7';
      const updatedAt = data.updatedAtLocal || data.timestamp || '';
      const info = updatedAt ? `<div class="subtitle" style="color:rgba(255,255,255,0.95); font-size:14px;">📅 Última actualización: ${formatTimestamp(updatedAt)}</div>` : '';
      return `
        <div class="card" style="background: linear-gradient(135deg, ${accent}, color-mix(in srgb, ${accent} 80%, black)); color:white;">
          <h2 style="font-size:clamp(22px,4vw,38px); margin-bottom:6px;">${data.tournamentName || 'Voleibol de Playa'}</h2>
          <div class="subtitle" style="color:rgba(255,255,255,0.95); font-size:15px;">
            ${data.subtitle || 'Fase de grupos y eliminatoria'}
          </div>
          ${info}
        </div>
      `;
    }

    function renderGroups(groups) {
      let html = '<div class="card"><h2>Fase de Grupos</h2><div class="groups">';
      ['A','B'].forEach(k => {
        const g = groups[k]; 
        if(!g || !g.teams || !g.teams.length) return;
        
        const teams = g.teams; 
        const matches = g.matches || [];
        html += `<div class="groupBox group${k}"><h3>Grupo ${k}</h3><div class="matches">`;
        
        matches.filter(m => m && typeof m === 'object').forEach(m => { 
          html += renderMatch(m, m.home, m.away); 
        });
        
        html += '</div>';
        const table = computeTable(matches, teams);
        html += `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>P</th>
                  <th>SF</th><th>SC</th><th>DS</th>
                  <th>PF</th><th>PC</th><th>DP</th>
                  <th>Pts</th>
                </tr>
              </thead>
              <tbody>
                ${table.map((row, i) => `
                  <tr class="${i === 0 ? 'first' : ''}">
                    <td class="pos">${i+1}</td>
                    <td>${teamIdentity(row.team)}</td>
                    <td>${row.PJ}</td>
                    <td>${row.G}</td>
                    <td>${row.P}</td>
                    <td>${row.SF}</td>
                    <td>${row.SC}</td>
                    <td>${row.DS}</td>
                    <td>${row.PF}</td>
                    <td>${row.PC}</td>
                    <td>${row.DP}</td>
                    <td class="pts">${row.Pts}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
            <div class="subtitle" style="margin-top:8px;">💡 Orden: Puntos → Dif. Sets → Dif. Puntos → Puntos a favor</div>
          </div>
        `;
        html += '</div>';
      });
      html += '</div></div>';
      return html;
    }

    function renderKnockout(k) {
      if (!k) return '';
      let html = '';
      if (k.final && k.final.winner) {
        html += `
          <div class="champion">
            <h2>🏆 CAMPEÓN 🏆</h2>
            <div class="team-name">${teamIdentity(k.final.winner)}</div>
          </div>
        `;
      }
      html += `
        <div class="card">
          <h2>Fase Eliminatoria</h2>
          <div class="bracket">
            <div class="semi">
              <h3>Semifinal 1 (1.º A vs 2.º B)</h3>
              ${renderMatch(k.sf1, k.sf1.home || '1.º A', k.sf1.away || '2.º B')}
              ${k.sf1.winner ? `<div class="info"><strong>Ganador: ${k.sf1.winner}</strong></div>` : ''}
            </div>
            <div class="semi">
              <h3>Semifinal 2 (1.º B vs 2.º A)</h3>
              ${renderMatch(k.sf2, k.sf2.home || '1.º B', k.sf2.away || '2.º A')}
              ${k.sf2.winner ? `<div class="info"><strong>Ganador: ${k.sf2.winner}</strong></div>` : ''}
            </div>
            <div class="third">
              <h3>Tercer Lugar</h3>
              ${renderMatch(k.third, k.third.home || 'Perdedor SF1', k.third.away || 'Perdedor SF2')}
              ${k.third.winner ? `<div class="info"><strong>Tercero: ${k.third.winner}</strong></div>` : ''}
            </div>
            <div class="final">
              <h3>Final</h3>
              ${renderMatch(k.final, k.final.home || 'Ganador SF1', k.final.away || 'Ganador SF2')}
              ${k.final.winner ? `<div class="info"><strong>🏆 Campeón: ${k.final.winner}</strong></div>` : ''}
            </div>
          </div>
        </div>
      `;
      return html;
    }

    async function loadData() {
      const fileName = getJsonFileNameFromUrl();
      console.log('Intentando cargar:', fileName);
      
      try {
        const res = await fetch(fileName, { cache: 'no-store' });
        if (!res.ok) {
          throw new Error(`No se pudo cargar ${fileName} (HTTP ${res.status})`);
        }
        
        const data = await res.json();
        teamProfiles = normalizeProfiles(data.teamProfiles);
        console.log('Datos cargados:', data);

        // Normaliza estructura mínima esperada
        const normalizedData = {
          tournamentName: data.tournamentName || 'Voleibol de Playa',
          subtitle: data.subtitle || 'Visualización de resultados',
          theme: Object.assign({color: '#0284c7', bg: '#f8fafc'}, data.theme || {}),
          points: Object.assign({win: 2, loss: 1}, data.points || {}),
          groups: {
            A: (data.groups && data.groups.A) ? data.groups.A : { teams: [], matches: [] },
            B: (data.groups && data.groups.B) ? data.groups.B : { teams: [], matches: [] }
          },
          knockout: Object.assign({ sf1: {}, sf2: {}, final: {}, third: {} }, data.knockout || {}),
          updatedAtLocal: data.updatedAtLocal || data.timestamp || ''
        };

        applyTheme(normalizedData.theme);
        
        const titleElement = document.getElementById('tournamentTitle');
        const subtitleElement = document.getElementById('tournamentSubtitle');
        
        if (titleElement) titleElement.textContent = normalizedData.tournamentName;
        if (subtitleElement) subtitleElement.textContent = normalizedData.subtitle;

        let html = '';
        html += renderCover(normalizedData);
        html += renderGroups(normalizedData.groups);
        html += renderKnockout(normalizedData.knockout);

        const contentElement = document.getElementById('tournamentContent');
        if (contentElement) {
          contentElement.innerHTML = html;
        }
        
      } catch (e) {
        console.error('Error cargando datos:', e);
        const contentElement = document.getElementById('tournamentContent');
        if (contentElement) {
          contentElement.innerHTML = `
            <div class="card error">
              <h2>Error al cargar datos</h2>
              <p style="margin-top:8px;">${e.message}</p>
              <p style="font-size:14px; color:var(--muted); margin-top:8px;">
                Verifica que <strong>${fileName}</strong> existe junto a este archivo.
                <br>También puedes especificar un archivo diferente usando el parámetro URL: 
                <code>?t=nombre-del-archivo</code>
              </p>
              <div style="margin-top:12px; font-size:14px;">
                <strong>Posibles soluciones:</strong>
                <ul style="margin-top:8px; padding-left:20px;">
                  <li>Asegúrate de que el archivo JSON existe en el mismo directorio</li>

    }

    // Cargar datos cuando el DOM esté listo
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadData);
    } else {
      loadData();
    }
